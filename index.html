<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0D9488" />
    <meta
      name="description"
      content="Tartila - game edukasi mengaji: Tilawati, kuis, dan mini game islami untuk anak."
    />

    <!-- ============================================ -->
    <!-- FONT LOADING (Gabarito, Plus Jakarta Sans,   -->
    <!-- Scheherazade New)                            -->
    <!-- ============================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Scheherazade+New:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@700&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tartila" />
    <title>Tartila - Game Edukasi Mengaji</title>

    <!-- Apply the persisted/OS/app theme before first paint to avoid FOUC -->
    <script>
      (function () {
        try {
          var appTheme = localStorage.getItem("tartila_app_theme");
          var storedTheme = localStorage.getItem("tartila-theme");

          // Prioritas: App Theme (night/neon) atau Stored Theme (dark). Default: Light.
          var dark =
            storedTheme === "dark" ||
            appTheme === "night" ||
            appTheme === "neon";

          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.backgroundColor = "#1E1B4B";
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.style.backgroundColor = "#F0FDF4";
          }
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
