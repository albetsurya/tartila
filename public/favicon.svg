<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="faceFrameClip">
      <rect x="4" y="4" width="120" height="120" rx="28" />
    </clipPath>
  </defs>

  <!-- Seluruh Isi Frame 100% Wajah Kuning Maskot (Tanpa Background Putih Sama Sekali) -->
  <g clip-path="url(#faceFrameClip)">
    <!-- Warna Dasar Wajah Kuning Penuh -->
    <rect x="0" y="0" width="128" height="128" fill="#FACC15" />

    <!-- Shading Dagu & Pipi Bawah (Kuning Keemasan) -->
    <path d="M0 92 C34 108 94 108 128 92 V128 H0 Z" fill="#F59E0B" />

    <!-- Highlight Kening di Bawah Peci -->
    <ellipse cx="64" cy="44" rx="44" ry="10" fill="#FEF08A" />

    <!-- Pipi Merona Coral (Kiri & Kanan) -->
    <circle cx="14" cy="86" r="13" fill="#FF6B6B" />
    <circle cx="114" cy="86" r="13" fill="#FF6B6B" />

    <!-- Alis Ekspresif -->
    <path d="M22 41 Q37 35 49 40" stroke="#134E4A" stroke-width="4.5" stroke-linecap="round" />
    <path d="M106 41 Q91 35 79 40" stroke="#134E4A" stroke-width="4.5" stroke-linecap="round" />

    <!-- MATA KIRI (Close-Up Besar) -->
    <g>
      <circle cx="37" cy="64" r="22" fill="#FFFFFF" stroke="#134E4A" stroke-width="5" />
      <circle cx="38.5" cy="64" r="15.5" fill="#0D9488" stroke="#134E4A" stroke-width="3.5" />
      <path d="M27.5 70 A12.5 12.5 0 0 0 49.5 70" stroke="#5EEAD4" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="38.5" cy="64" r="9.5" fill="#134E4A" />
      <circle cx="33" cy="57.5" r="5" fill="#FFFFFF" />
      <circle cx="43.5" cy="68.5" r="2.3" fill="#FFFFFF" />
    </g>

    <!-- MATA KANAN (Close-Up Besar) -->
    <g>
      <circle cx="91" cy="64" r="22" fill="#FFFFFF" stroke="#134E4A" stroke-width="5" />
      <circle cx="89.5" cy="64" r="15.5" fill="#0D9488" stroke="#134E4A" stroke-width="3.5" />
      <path d="M78.5 70 A12.5 12.5 0 0 0 100.5 70" stroke="#5EEAD4" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="89.5" cy="64" r="9.5" fill="#134E4A" />
      <circle cx="84" cy="57.5" r="5" fill="#FFFFFF" />
      <circle cx="94.5" cy="68.5" r="2.3" fill="#FFFFFF" />
    </g>

    <!-- PARUH TENGAH TERSENYUM -->
    <g>
      <!-- Mulut / Paruh Bawah -->
      <path d="M49 78 L64 106 L79 78 Z" fill="#9F1239" stroke="#134E4A" stroke-width="5" stroke-linejoin="round" />
      <!-- Lidah -->
      <path d="M53.5 87 Q64 82.5 74.5 87 L64 105 Z" fill="#FF6B6B" stroke="#134E4A" stroke-width="4" stroke-linejoin="round" />
      <!-- Paruh Atas -->
      <path d="M45 77 C45 65.5 83 65.5 83 77 C83 81.5 64 85 64 85 C64 85 45 81.5 45 77 Z" fill="#FF6B6B" stroke="#134E4A" stroke-width="5" stroke-linejoin="round" />
      <!-- Highlight Paruh -->
      <path d="M53 73 Q64 69.5 75 73" stroke="#FECDD3" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Detail Lekuk Dagu Bawah -->
    <path d="M56 114 Q64 118 72 114" stroke="#134E4A" stroke-width="4" stroke-linecap="round" />

    <!-- PECI / SONGKOK TARTILA DI KEPALA ATAS -->
    <g>
      <path d="M22 0 H106 L110 31 H18 L22 0 Z" fill="#134E4A" stroke="#134E4A" stroke-width="4.5" stroke-linejoin="round" />
      <rect x="18" y="24.5" width="92" height="7" rx="2" fill="#F59E0B" stroke="#134E4A" stroke-width="4" />
      <polygon points="64,6.5 66.6,12 72.8,12.6 68.2,16.5 69.5,22.5 64,19.3 58.5,22.5 59.8,16.5 55.2,12.6 61.4,12" fill="#FEF08A" />
    </g>
  </g>

  <!-- Border Frame Squircle Tegas (Edge-to-Edge) -->
  <rect x="4" y="4" width="120" height="120" rx="28"  />
</svg>