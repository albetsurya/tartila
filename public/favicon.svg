      <path d="M 335 204 L 408 162 C 420 172, 413 198, 392 212 C 407 220, 402 242, 374 249 C 378 262, 362 274, 335 268 Z" fill="#FFFFFF" stroke="#07473C" stroke-width="6.5" stroke-linejoin="round" />
      <path d="M 392 212 C 384 217, 377 220, 370 222 M 374 249 C 366 251, 360 251, 354 251" fill="none" stroke="#07473C" stroke-width="5.5" stroke-linecap="round" />
