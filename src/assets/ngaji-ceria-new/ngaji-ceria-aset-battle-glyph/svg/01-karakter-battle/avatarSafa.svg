    <path d="M 0 0 C -10 -8 -16 -18 -8 -22 C -3 -25 3 -18 4 -14 C 1 -24 5 -32 11 -30 C 17 -28 16 -18 12 -8 C 18 -15 25 -17 27 -11 C 29 -5 19 3 7 3 Z" fill="#A78BFA" stroke="#4C1D95" stroke-width="3" stroke-linejoin="round" />
    <circle cx="7" cy="-1" r="4" fill="#FBBF24" stroke="#4C1D95" stroke-width="2.2" />
  </g>

