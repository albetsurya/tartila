<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" role="img" aria-label="Avatar Santriwati Lilac &amp; Bibi">
  <!-- ========================================== -->
  <!-- 1. BAYANGAN STIKER & BINTANG ISLAMI 8 SUDUT -->
