  <!-- 6. MASKOT BURUNG BIBI MINI (VERSI UNGU)    -->
  <!-- ========================================== -->
  <g transform="translate(150, 118) scale(0.18)">
    <path d="M 60 -20 L 130 -65 C 142 -55 135 -25 100 -10 Z" fill="#A78BFA" stroke="#4C1D95" stroke-width="14" stroke-linejoin="round" />
