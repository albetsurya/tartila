  <!-- ========================================== -->
  <path d="M 74 74 Q 82 69 90 73" fill="none" stroke="#4C1D95" stroke-width="2.8" stroke-linecap="round" />
  <path d="M 110 73 Q 118 69 126 74" fill="none" stroke="#4C1D95" stroke-width="2.8" stroke-linecap="round" />

  <path d="M 68 88 L 63 84" stroke="#4C1D95" stroke-width="2.8" stroke-linecap="round" />
  <path d="M 132 88 L 137 84" stroke="#4C1D95" stroke-width="2.8" stroke-linecap="round" />

  <circle cx="73" cy="106" r="7.5" fill="#FF5E6C" />
  <circle cx="127" cy="106" r="7.5" fill="#FF5E6C" />

