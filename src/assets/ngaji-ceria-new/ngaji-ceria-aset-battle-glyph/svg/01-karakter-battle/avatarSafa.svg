  <path d="M 64 102 C 70 124 90 132 118 128 C 94 135 68 122 64 102 Z" fill="#F5C690" />
  <path d="M 66 78 C 74 52 126 52 134 78 C 120 68 80 68 66 78 Z" fill="#FFFFFF" stroke="#4C1D95" stroke-width="3.5" stroke-linejoin="round" />
  <ellipse cx="100" cy="93" rx="36" ry="39" fill="none" stroke="#4C1D95" stroke-width="3.8" />

