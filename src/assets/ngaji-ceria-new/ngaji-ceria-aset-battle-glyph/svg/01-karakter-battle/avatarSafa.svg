    <path d="M -45 -10 C -85 -35 -120 -60 -135 -48 C -145 -35 -115 -5 -80 5 C -55 12 -40 2 -45 -10 Z" fill="#8B5CF6" stroke="#4C1D95" stroke-width="14" stroke-linejoin="round" />

    <circle cx="-20" cy="5" r="14" fill="#FF5E6C" />
    <circle cx="65" cy="-2" r="12" fill="#FF5E6C" />

    <circle cx="-5" cy="-28" r="24" fill="#FFFFFF" stroke="#4C1D95" stroke-width="12" />
    <circle cx="-3" cy="-28" r="14" fill="#3B0764" />
    <circle cx="3" cy="-34" r="6" fill="#FFFFFF" />

    <circle cx="52" cy="-32" r="22" fill="#FFFFFF" stroke="#4C1D95" stroke-width="12" />
    <circle cx="54" cy="-32" r="13" fill="#3B0764" />
