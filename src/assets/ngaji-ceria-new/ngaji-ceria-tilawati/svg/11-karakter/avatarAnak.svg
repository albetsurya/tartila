<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 140" width="128" height="140" role="img" aria-label="Avatar Tartila">
  <defs>
    <!-- Pola Titik untuk Latar Belakang -->
    <pattern id="dots" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#0D9488" opacity="0.15" />
    </pattern>
    <!-- Clip Path agar Karakter tidak keluar lingkaran -->
    <clipPath id="circleClip">
      <circle cx="64" cy="68" r="52" />
    </clipPath>
  </defs>

  <!-- Hard Shadow Background (Gaya Stiker) -->
  <circle cx="64" cy="74" r="52" fill="#134E4A" />
  
  <!-- Main Background -->
  <circle cx="64" cy="68" r="52" fill="#F0FDF4" stroke="#134E4A" stroke-width="5" />
  
  <!-- Pola Titik di dalam Lingkaran -->
  <circle cx="64" cy="68" r="52" fill="url(#dots)" />

  <!-- Karakter (Dipotong oleh lingkaran agar rapi) -->
  <g clip-path="url(#circleClip)">
    
    <!-- Badan / Baju Koko -->
    <path d="M 20 120 C 24 92 40 86 64 86 C 88 86 104 92 108 120 Z" fill="#0D9488" stroke="#134E4A" stroke-width="5" stroke-linejoin="round" />
    
    <!-- Kerah Baju Koko (Putih) -->
    <path d="M 52 86 L 64 100 L 76 86" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 52 86 L 64 100 L 76 86" fill="none" stroke="#134E4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Leher -->
    <rect x="54" y="78" width="20" height="12" rx="6" fill="#FCD34D" stroke="#134E4A" stroke-width="4" />

    <!-- Wajah -->
    <circle cx="64" cy="60" r="26" fill="#FCD34D" stroke="#134E4A" stroke-width="5" />

    <!-- Peci -->
    <path d="M 38 48 C 38 28 50 22 64 22 C 78 22 90 28 90 48 C 80 40 48 40 38 48 Z" fill="#FFFFFF" stroke="#134E4A" stroke-width="5" stroke-linejoin="round" />
    
    <!-- Pita Peci -->
    <rect x="39" y="42" width="50" height="7" rx="3.5" fill="#FFFFFF" stroke="#134E4A" stroke-width="4" />

    <!-- Bintang Tartila di Peci (Coral Glow) -->
    <path d="M 64 30 L 66 35 L 71 35 L 67 38 L 68 43 L 64 40 L 60 43 L 61 38 L 57 35 L 62 35 Z" fill="#FF6B6B" stroke="#134E4A" stroke-width="2" stroke-linejoin="round" />

    <!-- Mata -->
    <circle cx="52" cy="62" r="4.5" fill="#134E4A" />
    <circle cx="76" cy="62" r="4.5" fill="#134E4A" />
    
    <!-- Catchlights (Pantulan Mata) -->
    <circle cx="50" cy="60" r="1.5" fill="#FFFFFF" />
    <circle cx="74" cy="60" r="1.5" fill="#FFFFFF" />

    <!-- Pipi Merah (Coral Glow) -->
    <circle cx="44" cy="72" r="6" fill="#FF6B6B" opacity="0.6" />
    <circle cx="84" cy="72" r="6" fill="#FF6B6B" opacity="0.6" />

    <!-- Mulut Tersenyum -->
    <path d="M 56 72 C 60 80 68 80 72 72" fill="none" stroke="#134E4A" stroke-width="4" stroke-linecap="round" />

    <!-- Badge Bintang di Baju (Aksen Tartila) -->
    <circle cx="80" cy="105" r="6" fill="#FF6B6B" stroke="#134E4A" stroke-width="2" />
    <path d="M 80 102 L 81 104 L 83 104 L 81.5 105.5 L 82 108 L 80 106.5 L 78 108 L 78.5 105.5 L 77 104 L 79 104 Z" fill="#FFFFFF" />

  </g>
</svg>