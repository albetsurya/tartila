<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 140" width="128" height="140" role="img" aria-label="Avatar Tartila Bersorak">
  <defs>
    <!-- Pola Titik untuk Latar Belakang -->
    <pattern id="dotsSorak" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#0D9488" opacity="0.15" />
    </pattern>
    <!-- Clip Path agar Karakter tidak keluar lingkaran -->
    <clipPath id="circleClipSorak">
      <circle cx="64" cy="70" r="52" />
    </clipPath>
  </defs>

  <!-- Hard Shadow Background -->
  <circle cx="64" cy="76" r="52" fill="#134E4A" />
  
  <!-- Main Background -->
  <circle cx="64" cy="70" r="52" fill="#F0FDF4" stroke="#134E4A" stroke-width="5" />
  
  <!-- Pola Titik -->
  <circle cx="64" cy="70" r="52" fill="url(#dotsSorak)" />

  <!-- Karakter (Dipotong oleh lingkaran) -->
  <g clip-path="url(#circleClipSorak)">
    
    <!-- Tangan Kiri (Bawah) -->
    <path d="M 40 110 Q 20 90 24 68" fill="none" stroke="#FCD34D" stroke-width="12" stroke-linecap="round" />
    <path d="M 40 110 Q 20 90 24 68" fill="none" stroke="#134E4A" stroke-width="16" stroke-linecap="round" opacity="0.2" /> <!-- Outline effect -->
    <path d="M 40 110 Q 20 90 24 68" fill="none" stroke="#FCD34D" stroke-width="10" stroke-linecap="round" />

    <!-- Tangan Kanan (Bawah) -->
    <path d="M 88 110 Q 108 90 104 68" fill="none" stroke="#FCD34D" stroke-width="12" stroke-linecap="round" />
    <path d="M 88 110 Q 108 90 104 68" fill="none" stroke="#134E4A" stroke-width="16" stroke-linecap="round" opacity="0.2" />
    <path d="M 88 110 Q 108 90 104 68" fill="none" stroke="#FCD34D" stroke-width="10" stroke-linecap="round" />

    <!-- Badan / Baju Koko -->
    <path d="M 24 116 C 28 92 44 86 64 86 C 84 86 100 92 104 116 Z" fill="#0D9488" stroke="#134E4A" stroke-width="5" stroke-linejoin="round" />
    
    <!-- Kerah Baju Koko (Putih) -->
    <path d="M 52 86 L 64 100 L 76 86" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 52 86 L 64 100 L 76 86" fill="none" stroke="#134E4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Leher -->
    <rect x="54" y="78" width="20" height="12" rx="6" fill="#FCD34D" stroke="#134E4A" stroke-width="4" />

    <!-- Wajah -->
    <circle cx="64" cy="62" r="26" fill="#FCD34D" stroke="#134E4A" stroke-width="5" />

    <!-- Peci -->
    <path d="M 38 50 C 38 30 50 24 64 24 C 78 24 90 30 90 50 C 80 42 48 42 38 50 Z" fill="#FFFFFF" stroke="#134E4A" stroke-width="5" stroke-linejoin="round" />
    
    <!-- Pita Peci -->
    <rect x="39" y="44" width="50" height="7" rx="3.5" fill="#FFFFFF" stroke="#134E4A" stroke-width="4" />

    <!-- Bintang Tartila di Peci -->
    <path d="M 64 32 L 66 37 L 71 37 L 67 40 L 68 45 L 64 42 L 60 45 L 61 40 L 57 37 L 62 37 Z" fill="#FF6B6B" stroke="#134E4A" stroke-width="2" stroke-linejoin="round" />

    <!-- Mata (Bersorak/Senyum Lebar) -->
    <path d="M 48 66 Q 53 58 58 66" fill="none" stroke="#134E4A" stroke-width="4" stroke-linecap="round" />
    <path d="M 70 66 Q 75 58 80 66" fill="none" stroke="#134E4A" stroke-width="4" stroke-linecap="round" />

    <!-- Pipi Merah -->
    <circle cx="44" cy="74" r="6" fill="#FF6B6B" opacity="0.6" />
    <circle cx="84" cy="74" r="6" fill="#FF6B6B" opacity="0.6" />

    <!-- Mulut Terbuka (Bersorak) -->
    <path d="M 52 74 C 56 92 72 92 76 74 Z" fill="#134E4A" />
    
    <!-- Lidah -->
    <path d="M 58 86 C 62 80 66 80 70 86 C 66 91 62 91 58 86 Z" fill="#FF6B6B" />

  </g>
</svg>