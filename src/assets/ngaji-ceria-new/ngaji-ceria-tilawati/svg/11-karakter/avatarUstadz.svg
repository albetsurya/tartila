<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 140" width="128" height="140" role="img" aria-label="Avatar Tartila Ustadz">
  <defs>
    <!-- Pola Titik untuk Latar Belakang -->
    <pattern id="dotsUstadz" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#0D9488" opacity="0.15" />
    </pattern>
    <!-- Clip Path agar Karakter tidak keluar lingkaran -->
    <clipPath id="circleClipUstadz">
      <circle cx="64" cy="70" r="52" />
    </clipPath>
  </defs>

  <!-- Hard Shadow Background -->
  <circle cx="64" cy="76" r="52" fill="#134E4A" />
  
  <!-- Main Background -->
  <circle cx="64" cy="70" r="52" fill="#F0FDF4" stroke="#134E4A" stroke-width="5" />
  
  <!-- Pola Titik -->
  <circle cx="64" cy="70" r="52" fill="url(#dotsUstadz)" />

  <!-- Karakter -->
  <g clip-path="url(#circleClipUstadz)">
    
    <!-- Badan / Baju Koko (Warna Lebih Gelap agar Terkesan Formal) -->
    <path d="M 24 116 C 28 92 44 86 64 86 C 84 86 100 92 104 116 Z" fill="#0F766E" stroke="#134E4A" stroke-width="5" stroke-linejoin="round" />
    
    <!-- Kerah Baju Koko (Putih) -->
    <path d="M 52 86 L 64 100 L 76 86" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 52 86 L 64 100 L 76 86" fill="none" stroke="#134E4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Badge Bintang Tartila di Dada -->
    <circle cx="64" cy="110" r="7" fill="#FF6B6B" stroke="#134E4A" stroke-width="2" />
    <path d="M 64 106 L 65.5 108.5 L 68.5 108.5 L 66 110 L 67 113 L 64 111.5 L 61 113 L 62 110 L 59.5 108.5 L 62.5 108.5 Z" fill="#FFFFFF" />

    <!-- Leher -->
    <rect x="54" y="78" width="20" height="12" rx="6" fill="#FCD34D" stroke="#134E4A" stroke-width="4" />

    <!-- Wajah -->
    <circle cx="64" cy="62" r="26" fill="#FCD34D" stroke="#134E4A" stroke-width="5" />

    <!-- Jenggot (Deep Teal agar Menyatu dengan Outline) -->
    <path d="M 40 66 C 40 96 88 96 88 66 C 84 84 44 84 40 66 Z" fill="#134E4A" stroke="#134E4A" stroke-width="2" />
    <!-- Kumis -->
    <path d="M 54 76 Q 64 72 74 76" fill="none" stroke="#134E4A" stroke-width="4" stroke-linecap="round" />

    <!-- Peci -->
    <path d="M 38 50 C 38 30 50 24 64 24 C 78 24 90 30 90 50 C 80 42 48 42 38 50 Z" fill="#FFFFFF" stroke="#134E4A" stroke-width="5" stroke-linejoin="round" />
    
    <!-- Pita Peci -->
    <rect x="39" y="44" width="50" height="7" rx="3.5" fill="#FFFFFF" stroke="#134E4A" stroke-width="4" />

    <!-- Bintang Tartila di Peci -->
    <path d="M 64 32 L 66 37 L 71 37 L 67 40 L 68 45 L 64 42 L 60 45 L 61 40 L 57 37 L 62 37 Z" fill="#FF6B6B" stroke="#134E4A" stroke-width="2" stroke-linejoin="round" />

    <!-- Mata (Sedikit Menyipit karena Kacamata) -->
    <circle cx="52" cy="62" r="3.5" fill="#134E4A" />
    <circle cx="76" cy="62" r="3.5" fill="#134E4A" />
    
    <!-- Catchlights -->
    <circle cx="50.5" cy="60.5" r="1" fill="#FFFFFF" />
    <circle cx="74.5" cy="60.5" r="1" fill="#FFFFFF" />

    <!-- Kacamata Bulat (Deep Teal) -->
    <circle cx="52" cy="62" r="9" fill="none" stroke="#134E4A" stroke-width="3.5" />
    <circle cx="76" cy="62" r="9" fill="none" stroke="#134E4A" stroke-width="3.5" />
    <!-- Jembatan Kacamata -->
    <path d="M 61 62 Q 64 59 67 62" fill="none" stroke="#134E4A" stroke-width="3.5" stroke-linecap="round" />

    <!-- Pipi Merah (Coral Glow) -->
    <circle cx="44" cy="74" r="5" fill="#FF6B6B" opacity="0.6" />
    <circle cx="84" cy="74" r="5" fill="#FF6B6B" opacity="0.6" />

    <!-- Mulut Tersenyum (di bawah kumis) -->
    <path d="M 58 82 C 61 87 67 87 70 82" fill="none" stroke="#FCD34D" stroke-width="3.5" stroke-linecap="round" />

  </g>
</svg>